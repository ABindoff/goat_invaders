name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            automake \
            openjdk-17-jdk-headless

      - name: Configure buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/build-*_armeabi-v7a
          mkdir -p ~/.buildozer/android/platform/build-*_arm64-v8a

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 90

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: goat-invaders-debug
          path: bin/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
